<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Enrollment Form</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
</head>
<body>
<div class="container">
    <h2 class="text-center">Student Enrollment Form</h2>
    <form id="stuForm">
        <div class="form-group">
            <label>Roll-No:</label>
            <input type="text" class="form-control" id="rollNo" onchange="getStudent()">
        </div>
        <div class="form-group">
            <label>Full-Name:</label>
            <input type="text" class="form-control" id="fullName" disabled>
        </div>
        <div class="form-group">
            <label>Class:</label>
            <input type="text" class="form-control" id="stuClass" disabled>
        </div>
        <div class="form-group">
            <label>Birth-Date:</label>
            <input type="text" class="form-control" id="birthDate" placeholder="DD-MM-YYYY" disabled>
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" class="form-control" id="address" disabled>
        </div>
        <div class="form-group">
            <label>Enrollment-Date:</label>
            <input type="text" class="form-control" id="enrollDate" placeholder="DD-MM-YYYY" disabled>
        </div>
        <div class="text-center">
            <button type="button" class="btn btn-primary" id="save" onclick="saveData()" disabled>Save</button>
            <button type="button" class="btn btn-warning" id="update" onclick="updateData()" disabled>Update</button>
            <button type="button" class="btn btn-default" id="reset" onclick="resetForm()" disabled>Reset</button>
        </div>
    </form>
</div>
<script src="StudentDB.js"></script>
</body>
</html>
